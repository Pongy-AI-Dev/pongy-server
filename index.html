<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' https://pongy-server.onrender.com https://pongy.chat; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
<meta name="referrer" content="no-referrer">
<title>Pongy AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
:root{--bg:#fff;--bg2:#f7f7f9;--bg3:#f0f0f3;--fg:#111;--fg2:#666;--border:#e3e3e8;--accent:#6366f1;--accent-h:#4f46e5;--user:#6366f1;--user-fg:#fff;--ai:#f0f0f3;--ai-fg:#111;--hover:rgba(0,0,0,.055);--hover-strong:rgba(0,0,0,.09);--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--code-bg:rgba(127,127,127,.15);--code-fg:#111}
body.dark{--bg:#0f0f10;--bg2:#16161a;--bg3:#1b1b1f;--fg:#f0f0f3;--fg2:#a8a8b0;--border:#2a2a2e;--accent:#6366f1;--accent-h:#7c7ff5;--ai:#1b1b1f;--ai-fg:#f0f0f3;--hover:rgba(255,255,255,.06);--hover-strong:rgba(255,255,255,.1);--code-bg:rgba(255,255,255,.1);--code-fg:#f0f0f3}
body{background:var(--bg);color:var(--fg);display:flex;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit;outline:none}
#sidebar{width:300px;height:100%;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .3s,transform .3s;flex-shrink:0;position:relative}
body.collapsed #sidebar{width:64px}
body.hidden-sidebar #sidebar{width:0;border-right:none;overflow:hidden}
body.hidden-sidebar #collapseBtn{display:none}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px;height:56px;flex-shrink:0}
body.collapsed .sb-head{justify-content:center}
body.collapsed .sb-title{display:none}
.logo{width:34px;height:34px;border-radius:10px;flex-shrink:0;overflow:hidden;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.logo svg{display:block;width:100%;height:100%;border-radius:10px}
.sb-title{font-weight:600;font-size:15px;margin-left:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.sb-search{display:flex;align-items:center;gap:8px;padding:0 10px 8px;flex-shrink:0}
body.collapsed .sb-search{display:none}
.sb-search-inner{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.sb-search-inner:focus-within{border-color:var(--accent)}
.sb-search-inner svg{flex-shrink:0;color:var(--fg2)}
#sbSearchInput{flex:1;background:transparent;border:none;font-size:13px;color:var(--fg);min-width:0}
#sbSearchInput::placeholder{color:var(--fg2)}
.sb-list{flex:1;overflow-y:auto;padding:6px 8px;min-height:0}
.sb-list::-webkit-scrollbar{width:8px}
.sb-list::-webkit-scrollbar-thumb{background:var(--hover-strong);border-radius:4px}
body.collapsed .sb-list{padding:6px 4px}
.sb-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);padding:10px 12px 6px;font-weight:500}
body.collapsed .sb-label{display:none}
.chat-item{display:flex;gap:8px;padding:9px 11px;border-radius:12px;cursor:pointer;transition:background .15s;position:relative;margin-bottom:2px}
body.collapsed .chat-item{padding:9px;justify-content:center;align-items:center}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--hover-strong)}
.chat-ico{flex-shrink:0;opacity:.6;margin-top:2px;color:var(--fg2)}
.chat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
body.collapsed .chat-body{display:none}
.chat-title{font-size:13.5px;color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item.active .chat-time{color:var(--accent);font-weight:500}
.chat-actions{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px;background:linear-gradient(90deg,transparent,var(--bg2) 20%);padding-left:12px}
.chat-item:hover .chat-actions{display:flex}
.chat-item.active .chat-actions{background:linear-gradient(90deg,transparent,var(--hover-strong) 20%)}
.chat-act{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.chat-act:hover{background:var(--hover-strong);color:var(--fg)}
.chat-act.pin-icon.on{color:var(--accent)}
.chat-act.danger:hover{background:rgba(239,68,68,.15);color:var(--danger)}
.chat-empty{text-align:center;padding:20px;font-size:12.5px;color:var(--fg2)}
.rename-input{width:100%;background:var(--bg);border:1.5px solid var(--accent);border-radius:8px;padding:5px 8px;font-size:13.5px;color:var(--fg)}
.sb-bottom{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
.sb-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;color:var(--fg2);font-size:13px;min-width:0}
.sb-btn:hover{background:var(--hover);color:var(--fg)}
body.collapsed .sb-btn span{display:none}
body.collapsed .sb-bottom{flex-direction:column}
#collapseBtn{position:absolute;top:50%;right:-14px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg2);z-index:50}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.tb-menu{width:34px;height:34px;border-radius:12px;display:none;align-items:center;justify-content:center;color:var(--fg2)}
.tb-title{font-weight:500;font-size:13.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.tb-btn:hover{background:var(--hover);color:var(--fg)}
.tb-btn.active{color:var(--accent)}
@media(max-width:768px){.tb-menu{display:flex}}
#messages{flex:1;overflow-y:auto;padding:16px 0;min-height:0}
#messages::-webkit-scrollbar{width:8px}
#messages::-webkit-scrollbar-thumb{background:var(--hover-strong);border-radius:4px}
.msg-wrap{max-width:768px;margin:0 auto;padding:0 16px}
.welcome{height:100%;display:flex;align-items:center;justify-content:center;padding:0 24px}
.welcome-inner{text-align:center;max-width:560px;animation:fade .35s}
.welcome .big-logo{width:80px;height:80px;border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(99,102,241,.35);animation:glow 3s ease-in-out infinite;margin:0 auto 24px}
.welcome .big-logo svg{display:block;width:100%;height:100%;border-radius:24px}
@keyframes glow{0%,100%{box-shadow:0 8px 32px rgba(99,102,241,.35)}50%{box-shadow:0 8px 42px rgba(99,102,241,.55)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes popIn{0%{opacity:0;transform:scale(.94) translateY(-6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.welcome p{color:var(--fg2);font-size:17px;line-height:1.6}
.msg{display:flex;padding:6px 0;animation:slide .3s}
.msg.user{justify-content:flex-end}
.msg.ai{justify-content:flex-start}
.msg-content{display:flex;flex-direction:column;max-width:82%;min-width:0;position:relative}
.msg.user .msg-content{align-items:flex-end}
.bubble{padding:11px 17px;border-radius:22px;font-size:15px;line-height:1.55;word-wrap:break-word;overflow-wrap:break-word}
.msg.user .bubble{background:var(--user);color:var(--user-fg);border-bottom-right-radius:8px;box-shadow:0 2px 8px rgba(99,102,241,.2);white-space:pre-wrap}
.msg.ai .bubble{background:var(--ai);color:var(--ai-fg);border-bottom-left-radius:8px;border:1px solid var(--border);white-space:pre-wrap}
.bubble code{background:var(--code-bg);color:var(--code-fg);padding:2px 6px;border-radius:6px;font-family:Consolas,Monaco,monospace;font-size:13px}
.bubble pre{background:#111;color:#f0f0f3;padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;font-family:Consolas,Monaco,monospace;font-size:12.5px;line-height:1.5}
.bubble a{color:var(--accent);text-decoration:none;word-break:break-all}
.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
.caret{display:inline-block;width:6px;height:15px;background:currentColor;vertical-align:-2px;margin-left:2px;border-radius:1px;animation:blink .9s infinite}
.msg-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .18s;pointer-events:none;position:relative}
.msg:hover .msg-actions{opacity:1;pointer-events:auto}
.msg-act{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:11.5px;color:var(--fg2)}
.msg-act:hover{background:var(--hover);color:var(--fg)}
.msg-act.danger:hover{background:rgba(239,68,68,.12);color:var(--danger)}
.thinking-box{display:flex;align-items:center;gap:12px;padding:2px 0;min-height:26px}
.think-orb{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7,#6366f1);background-size:300% 300%;animation:orbWave 1.6s ease-in-out infinite;flex-shrink:0;position:relative}
.think-orb::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(99,102,241,.3);animation:pulseRing 1.6s ease-out infinite}
@keyframes orbWave{0%,100%{transform:scale(1);background-position:0% 50%}50%{transform:scale(1.12);background-position:100% 50%}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
.think-text{font-size:14.5px;color:var(--ai-fg);opacity:.85;display:flex;align-items:baseline;gap:2px}
.think-text .dots{display:inline-flex;gap:2px;margin-left:2px}
.think-text .dots span{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dotJump 1.2s infinite}
.think-text .dots span:nth-child(2){animation-delay:.15s}
.think-text .dots span:nth-child(3){animation-delay:.3s}
@keyframes dotJump{0%,60%,100%{opacity:.3}30%{opacity:1}}
.msg-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);font-size:11.5px;color:var(--fg2);font-weight:500}
.meta-badge.accent{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.35);color:var(--accent)}
#inputArea{flex-shrink:0;padding:8px 16px 14px;background:var(--bg)}
#inputInner{max-width:768px;margin:0 auto}
.modes{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;position:relative}
.mode-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:14px;font-size:13px;border:1px solid var(--border);background:var(--bg3);color:var(--fg2)}
.mode-btn:hover{color:var(--fg);border-color:var(--hover-strong)}
.mode-btn.active{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.5);color:var(--accent)}
.agent-badge{font-size:11px;opacity:.85}
.agent-popup{position:absolute;bottom:calc(100% + 8px);left:0;min-width:320px;background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:8px;z-index:60;display:none}
.agent-popup.open{display:block;animation:popIn .18s}
.popup-section{padding:8px 6px}
.popup-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);font-weight:600;padding:6px 10px 8px}
.agent-opt,.think-opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;position:relative;border:1.5px solid transparent}
.agent-opt:hover,.think-opt:hover{background:var(--hover);border-color:var(--border)}
.agent-opt.current,.think-opt.current{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.5)}
.agent-info{flex:1;min-width:0}
.agent-name,.think-name{font-size:13.5px;font-weight:500;color:var(--fg)}
.agent-opt.current .agent-name,.think-opt.current .think-name{color:var(--accent);font-weight:600}
.agent-sub{font-size:11px;color:var(--fg2);margin-top:2px}
.agent-tag,.think-tag{font-size:11px;padding:3px 9px;border-radius:7px;font-weight:600;flex-shrink:0}
.agent-tag.free,.think-tag.free{background:rgba(16,185,129,.15);color:#10b981}
.agent-tag.custom{background:rgba(59,130,246,.15);color:#3b82f6}
.agent-tag.plus,.think-tag.plus{background:rgba(239,68,68,.15);color:var(--danger)}
.think-tag.note{background:rgba(99,102,241,.12);color:var(--accent)}
.popup-divider{height:1px;background:var(--border);margin:6px 4px}
.crown{display:inline-block;width:12px;height:12px}
.input-box{background:var(--bg3);border:1px solid var(--border);border-radius:22px;padding:6px;display:flex;align-items:flex-end;gap:4px;position:relative}
.input-box:focus-within{border-color:rgba(99,102,241,.5)}
.input-box button{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex-shrink:0}
.input-box button:hover{background:var(--hover)}
#sendBtn{background:var(--hover-strong);color:var(--fg2);cursor:not-allowed}
#sendBtn.ready{background:var(--accent);color:#fff;cursor:pointer}
#stopBtn{background:#ef4444!important;color:#fff!important}
#micBtn.recording{background:var(--danger)!important;color:#fff!important}
#userInput{flex:1;background:transparent;border:none;resize:none;padding:10px 6px;font-size:15px;max-height:160px;min-height:20px;line-height:1.4;color:var(--fg);min-width:0}
#userInput::placeholder{color:var(--fg2)}
.footer-text{text-align:center;font-size:11px;color:var(--fg2);margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.overlay.open{display:flex}
.modal-box{width:100%;max-width:560px;max-height:92vh;background:var(--bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;animation:slide .25s}
.modal-box.wide{max-width:900px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.modal-head h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-body{padding:0;overflow-y:auto;flex:1;min-height:0}
.modal-body::-webkit-scrollbar{width:8px}
.modal-body::-webkit-scrollbar-thumb{background:var(--hover-strong);border-radius:4px}
.settings-body{padding:20px;display:flex;flex-direction:column;gap:18px}
.field-label{font-size:13.5px;font-weight:500;margin-bottom:10px;color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:11px 13px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);color:var(--fg2);font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt.active{border-color:var(--accent);background:rgba(99,102,241,.1);color:var(--accent)}
.opt .flag{font-size:17px}
.inp{width:100%;padding:11px 15px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);font-size:14px;color:var(--fg)}
.inp:focus{border-color:var(--accent)}
.hint{font-size:11px;color:var(--fg2);margin-top:6px}
.support-link{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--bg3);border:1px solid var(--border);text-decoration:none;color:var(--fg)}
.support-link:hover{border-color:var(--accent)}
.support-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.support-title{font-weight:500;font-size:14px;color:var(--fg);margin-bottom:2px}
.support-email{font-size:12.5px;color:var(--accent);word-break:break-all}
.guide-toc{display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;flex-shrink:0}
.guide-tab{padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:500;color:var(--fg2);white-space:nowrap;cursor:pointer;border:1px solid transparent}
.guide-tab:hover{background:var(--hover);color:var(--fg)}
.guide-tab.active{background:rgba(99,102,241,.12);color:var(--accent);border-color:rgba(99,102,241,.4)}
.guide-section{padding:22px 24px;display:none}
.guide-section.active{display:block}
.guide-section h3{font-size:17px;font-weight:700;color:var(--fg);margin-bottom:14px}
.guide-section h4{font-size:14px;font-weight:600;color:var(--fg);margin:18px 0 8px}
.guide-section p{font-size:13.5px;line-height:1.7;color:var(--fg);margin-bottom:10px}
.guide-section ul{margin:8px 0 14px 0;padding-left:22px}
.guide-section li{font-size:13.5px;line-height:1.65;color:var(--fg);margin-bottom:6px}
.guide-section .note{background:var(--bg3);border-left:3px solid var(--accent);padding:12px 16px;border-radius:8px;font-size:12.5px;color:var(--fg2);line-height:1.6;margin:14px 0}
.guide-section .note.warn{border-left-color:var(--warning)}
.confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:300}
.confirm-modal.open{display:flex}
.confirm-box{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:24px}
.confirm-title{font-size:17px;font-weight:600;color:var(--fg);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.confirm-title svg{color:#ef4444;flex-shrink:0}
.confirm-text{font-size:14px;color:var(--fg2);line-height:1.55;margin-bottom:22px}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}
.confirm-btn{padding:10px 20px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer}
.confirm-btn.primary{background:var(--accent);color:#fff}
.confirm-btn.secondary{background:transparent;border:1.5px solid var(--border);color:var(--fg2)}
.report-popup{position:absolute;bottom:calc(100% + 8px);right:0;width:320px;background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:16px;z-index:60}
.report-popup h4{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:10px}
.report-popup textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--bg3);font-size:13.5px;color:var(--fg);resize:vertical;font-family:inherit}
.report-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.report-actions button{padding:8px 14px;border-radius:11px;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.report-actions .send-btn{background:var(--accent);color:#fff}
.report-actions .cancel-btn{background:var(--hover);color:var(--fg2)}
.report-thanks{text-align:center;padding:20px 8px}
.report-thanks p{font-size:14.5px;color:var(--fg);line-height:1.5}
.edit-area{display:flex;flex-direction:column;gap:8px;min-width:280px}
.edit-area textarea{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:14px;color:var(--fg);resize:vertical;min-height:60px;font-family:inherit}
.edit-area .btns{display:flex;gap:8px;justify-content:flex-end}
.edit-area .btns button{padding:7px 14px;border-radius:10px;font-size:12.5px;cursor:pointer}
.edit-area .btns .save{background:var(--accent);color:#fff}
.edit-area .btns .cancel{background:var(--hover);color:var(--fg2)}
.overlay-bd{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:30}
.overlay-bd.show{display:block}
@media(max-width:768px){
#sidebar{position:fixed;z-index:40;transform:translateX(-100%);width:300px}

function formatChatTime(ts,isActive){
if(!ts)return '';
if(isActive)return t().timeActive;
var now=Date.now(),s=Math.floor((now-ts)/1000);
if(s<5)return t().timeNow;
if(s<60)return s+' '+t().timeSec;
var m=Math.floor(s/60);
if(m<60)return m+' '+t().timeMin;
var h=Math.floor(m/60);
var today=new Date(),yd=new Date(today.getTime()-86400000),d=new Date(ts);
if(d.toDateString()===today.toDateString())return h+' '+t().timeHour;
if(d.toDateString()===yd.toDateString())return t().timeYesterday;
return d.toLocaleDateString(settings.lang,{day:'numeric',month:'short'});
}

function commitRename(id,newName){

state.renamingId=null;renderChatList();renderMessages();updateTopbarTitle();
}
function togglePin(id){
var chat=chats.find(function(c){return c.id===id});

}
function doDeleteChat(id){

if(!chats.length){
chats=[{id:Date.now()+'-'+Math.random().toString(36).slice(2,6),title:'',messages:[],updatedAt:Date.now(),pinned:false}];
syncChat(chats[0]);
}
if(!chats.find(function(c){return c.id===activeId}))activeId=chats[0].id;
renderChatList();renderMessages();updateTopbarTitle();
}

function renderMd(text){
text=esc(text);
text=text.replace(/```([\w+-]*)\n?([\s\S]*?)```/g,function(_,l,c){return '<pre>'+c.replace(/^\n/,'')+'</pre>'});
text=text.replace(/`([^`]+)`/g,'<code>$1</code>');
text=text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
text=text.replace(/\*([^*]+)\*/g,'<em>$1</em>');
text=text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,label,url){return '<a href="'+safeUrl(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'});
var lines=text.split('\n'),out=[],inUl=false,inOl=false;
lines.forEach(function(l){
if(/^\s*[-*]\s+/.test(l)){if(!inUl){if(inOl){out.push('</ol>');inOl=false}out.push('<ul>');inUl=true}out.push('<li>'+l.replace(/^\s*[-*]\s+/,'')+'</li>');return}
if(/^\s*\d+\.\s+/.test(l)){if(!inOl){if(inUl){out.push('</ul>');inUl=false}out.push('<ol>');inOl=true}out.push('<li>'+l.replace(/^\s*\d+\.\s+/,'')+'</li>');return}
if(inUl){out.push('</ul>');inUl=false}if(inOl){out.push('</ol>');inOl=false}
out.push(l);
});
if(inUl)out.push('</ul>');if(inOl)out.push('</ol>');
return out.join('\n');
}

function streamApi(payload,onChunk,onDone,onError){
var controller=typeof AbortController!=='undefined'?new AbortController():null;
state.abort=controller||{aborted:false,abort:function(){this.aborted=true}};
var messages=[{role:'system',content:payload.system}].concat(payload.history).concat([{role:'user',content:payload.text}]);
fetch(API_URL+'/api/chat',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
body:JSON.stringify({messages:messages}),
signal:controller?controller.signal:undefined
}).then(function(res){
if(!res.ok)return res.text().then(function(txt){
var msg='HTTP '+res.status;
try{
var j=JSON.parse(txt);
if(j&&j.error){
if(typeof j.error==='string')msg=j.error;
else if(j.error.message)msg=j.error.message;
else msg=JSON.stringify(j.error);
}else if(j&&j.message){msg=j.message}
else if(txt){msg=txt.slice(0,200)}
}catch(e){msg=txt?txt.slice(0,200):msg}
throw new Error(msg);
});
var reader=res.body.getReader();var dec=new TextDecoder();var buf='';
function pump(){
return reader.read().then(function(r){
if(r.done){onDone();return}
buf+=dec.decode(r.value,{stream:true});
var lines=buf.split('\n');buf=lines.pop()||'';
for(var i=0;i<lines.length;i++){
var line=lines[i].trim();
if(!line||line.indexOf('data:')!==0)continue;
var data=line.slice(5).trim();
if(data==='[DONE]'){onDone();return}
try{
var j=JSON.parse(data);
var dd=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
if(dd)onChunk(dd);
}catch(e){}
}
return pump();
});
}
return pump();
}).catch(function(e){
if(e.name==='AbortError')return;
onError({message:e.message||'Connection failed'});
});
}

function sendMessage(text,opts){
if(state.streaming)return;
var chat=chats.find(function(c){return c.id===activeId});if(!chat)return;
var history=chat.messages.slice();
var metaId='m'+Date.now()+Math.random().toString(36).slice(2,6);
var meta={id:metaId,smart:!!opts.smart,search:!!opts.search,startTime:Date.now(),firstChunkTime:null,endTime:null,chars:0};
chat.title=chat.messages.length===0?text.slice(0,32):chat.title;
chat.messages=chat.messages.concat([{role:'user',text:text},{role:'assistant',text:'',meta:meta}]);
chat.updatedAt=Date.now();
state.streaming=true;
renderChatList();renderMessages();updateInputState();
var system='You are Pongy, a kind personal AI assistant. '+(settings.nickname?'The user\'s name is '+settings.nickname+'. ':'')+(opts.smart?'Think step by step. ':'Answer briefly. ')+(opts.search?'Use up-to-date knowledge.':'');
streamApi({text:text,history:history,system:system},
function(chunk){
var c=chats.find(function(x){return x.id===activeId});if(!c)return;
var msgs=c.messages.slice();var last=msgs[msgs.length-1];
if(!last||last.role!=='assistant')return;
var nt=last.text+chunk;
var nm=Object.assign({},last.meta);
if(!nm.firstChunkTime)nm.firstChunkTime=Date.now();
nm.chars=nt.length;
msgs[msgs.length-1]={role:'assistant',text:nt,meta:nm};
c.messages=msgs;
renderMessages();
},
function(){
var c=chats.find(function(x){return x.id===activeId});
if(c){
var msgs=c.messages.slice();var last=msgs[msgs.length-1];
if(last&&last.role==='assistant'&&last.meta)last.meta=Object.assign({},last.meta,{endTime:Date.now()});
c.messages=msgs;c.updatedAt=Date.now();
syncChat(c);
}
state.streaming=false;state.abort=null;
renderChatList();renderMessages();updateInputState();
},
function(e){
if(e&&e.name==='AbortError'){state.streaming=false;state.abort=null;renderChatList();renderMessages();updateInputState();return}
var msg=(e&&e.message)||'Unknown error';
var c=chats.find(function(x){return x.id===activeId});
if(c){
var msgs=c.messages.slice();var last=msgs[msgs.length-1];
var sep=(last&&last.text)?'\n\n':'';
var sm=Object.assign({},(last&&last.meta)||{},{endTime:Date.now()});
msgs[msgs.length-1]={role:'assistant',text:((last&&last.text)||'')+sep+'⚠️ '+t().err+': '+msg,meta:sm};
c.messages=msgs;c.updatedAt=Date.now();syncChat(c);
}
state.streaming=false;state.abort=null;
renderChatList();renderMessages();updateInputState();
});
}

secs+='<div class="guide-section'+(state.guideSection==='privacy'?' active':'')+'"><h3>'+esc(tt.gPrivTitle)+'</h3><p>'+esc(tt.gPrivP1)+'</p><h4>'+esc(tt.gPrivP2)+'</h4><ul><li>'+esc(tt.gPrivList1)+'</li><li>'+esc(tt.gPrivList2)+'</li><li>'+esc(tt.gPrivList3)+'</li></ul><h4>'+esc(tt.gPrivP3)+'</h4><ul><li>'+esc(tt.gPrivList4)+'</li><li>'+esc(tt.gPrivList5)+'</li></ul></div>';
secs+='<div class="guide-section'+(state.guideSection==='rules'?' active':'')+'"><h3>'+esc(tt.gRulesTitle)+'</h3><ul><li>'+esc(tt.gRule1)+'</li><li>'+esc(tt.gRule2)+'</li><li>'+esc(tt.gRule3)+'</li><li>'+esc(tt.gRule4)+'</li><li>'+esc(tt.gRule5)+'</li></ul><div class="note warn">'+esc(tt.gRulesNote)+'</div></div>';
secs+='<div class="guide-section'+(state.guideSection==='api'?' active':'')+'"><h3>'+esc(tt.gApiTitle)+'</h3><p>'+esc(tt.gApiP1)+'</p><p>'+esc(tt.gApiP2)+'</p></div>';
secs+='<div class="guide-section'+(state.guideSection==='security'?' active':'')+'"><h3>'+esc(tt.gSecTitle)+'</h3><p>'+esc(tt.gSecP1)+'</p><ul><li>'+esc(tt.gSecList1)+'</li><li>'+esc(tt.gSecList2)+'</li><li>'+esc(tt.gSecList3)+'</li><li>'+esc(tt.gSecList4)+'</li><li>'+esc(tt.gSecList5)+'</li><li>'+esc(tt.gSecList6)+'</li></ul><div class="note warn">'+esc(tt.gSecNote)+'</div></div>';
guideSections.innerHTML=secs;
}
function openGuide(){state.guideSection='guide';renderGuide();guideModal.classList.add('open')}
function closeGuide(){guideModal.classList.remove('open')}
$('guideBtn').onclick=openGuide;
$('closeGuide').onclick=closeGuide;
guideModal.onclick=function(e){if(e.target===guideModal)closeGuide()};

$('newChatBtn').onclick=newChat;
$('collapseBtn').onclick=function(){
body.classList.toggle('collapsed');
this.querySelector('path').setAttribute('d',body.classList.contains('collapsed')?'M9 18l6-6-6-6':'M15 18l-6-6 6-6');
renderChatList();
};
$('menuBtn').onclick=function(){sidebar.classList.add('open');overlay.classList.add('show')};
overlay.onclick=function(){sidebar.classList.remove('open');overlay.classList.remove('show')};
$('hideSidebarBtn').onclick=function(){
state.sidebarHidden=!state.sidebarHidden;
save('pongy_sidebar_hidden',state.sidebarHidden);
applySettings();
};
$('shareBtn').onclick=function(){
var chat=chats.find(function(c){return c.id===activeId});
if(!chat||!chat.messages.length){alert(t().shareNoChat);return}
var lines=chat.messages.map(function(m){return (m.role==='user'?'[You]: ':'[Pongy]: ')+(m.text||'')}).join('\n\n');
var text='--- Pongy AI chat: '+(chat.title||t().untitled)+' ---\n\n'+lines+'\n\n--- Shared from Pongy AI ---';
if(navigator.share){navigator.share({title:'Pongy AI',text:text}).catch(function(){})}
else if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){
var btn=$('shareBtn');var orig=btn.innerHTML;
btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
setTimeout(function(){btn.innerHTML=orig},1400);
})}
};
$('logoutBtn').onclick=function(){
showConfirm('Sign out?','You will need to log in again to access your chats.','Sign out','Cancel',function(){
authToken='';currentUser=null;
localStorage.removeItem('pongy_token');
chats=[];activeId=null;
document.getElementById('authEmail').value='';
document.getElementById('authPassword').value='';
showAuthScreen();
});
};

function initAuthUI(){
var btn=document.getElementById('authBtn');
btn.onclick=function(){
var email=document.getElementById('authEmail').value.trim();
var pass=document.getElementById('authPassword').value;
var err=document.getElementById('authError');
err.style.display='none';
if(!email||!pass){err.textContent='Enter email and password';err.style.display='block';return}
btn.disabled=true;btn.textContent='Please wait…';
apiFetch('/api/'+authMode,{method:'POST',body:{email:email,password:pass}})
.then(function(data){
authToken=data.token;localStorage.setItem('pongy_token',authToken);
currentUser=data.user;
return loadUserChats();
})
.then(function(){
hideAuthScreen();renderChatList();renderMessages();renderSubStatusBox();
})
.catch(function(e){
err.textContent=e.message;err.style.display='block';
})
.finally(function(){btn.disabled=false;btn.textContent=authMode==='login'?'Sign in':'Register'});
};
document.getElementById('authSwitch').onclick=function(){
authMode=authMode==='login'?'register':'login';
document.getElementById('authSubtitle').textContent=authMode==='login'?'Sign in to continue':'Create your account';
document.getElementById('authBtn').textContent=authMode==='login'?'Sign in':'Register';
document.getElementById('authSwitchText').textContent=authMode==='login'?'No account?':'Have an account?';
document.getElementById('authSwitch').textContent=authMode==='login'?'Register':'Sign in';
};
}

$('logoTop').innerHTML=LOGO_SVG;
applySettings();
initAuthUI();

if(authToken){
apiFetch('/api/me')
.then(function(user){
currentUser=user;
if(user.nickname){settings.nickname=user.nickname;save('pongy_settings_ui',settings)}
return loadUserChats();
})
.then(function(){
hideAuthScreen();renderChatList();renderMessages();
})
.catch(function(){
authToken='';localStorage.removeItem('pongy_token');
showAuthScreen();
});
}else{
showAuthScreen();
}
updateInputState();
setInterval(function(){if(currentUser)renderChatList()},60000);

(function checkPaymentReturn(){
try{
var params=new URLSearchParams(window.location.search);
if(params.get('payment')==='success'&&authToken){
apiFetch('/api/me').then(function(user){
currentUser=user;
renderSubStatusBox();
if(window.history&&window.history.replaceState)window.history.replaceState({},'','/');
setTimeout(function(){alert('✅ Payment successful! Plus is now active.')},500);
}).catch(function(){});
}
}catch(e){}
})();

})();
</script>
